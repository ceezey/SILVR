name: silver-bot

x-safe-environment: &safe-environment
  LIVE_TRADING: "false"
  DATABASE_URL: postgresql://silverbot:silverbot@postgres:5432/silverbot
  ML_REGISTRY_PATH: /app/models/model_registry.json
  TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-false}"
  ML_FILTER_ENABLED: "${ML_FILTER_ENABLED:-false}"

x-bot-common: &bot-common
  build:
    context: .
  image: silver-bot:local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./models:/app/models
    - ./reports:/app/reports

services:
  # Local Postgres for the bot and the tests; the major version matches Railway's Postgres template.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: silverbot
      POSTGRES_PASSWORD: silverbot
      POSTGRES_DB: silverbot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silverbot -d silverbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  bot:
    <<: *bot-common
    container_name: silver-bot-paper
    environment:
      <<: *safe-environment
      TRADING_MODE: paper
      PAPER_TRADING: "true"
    command: ["python", "-m", "silver_bot"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  paper:
    <<: *bot-common
    profiles: ["paper"]
    environment:
      <<: *safe-environment
      TRADING_MODE: paper
      PAPER_TRADING: "true"
    command: ["python", "-m", "silver_bot"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  demo:
    <<: *bot-common
    profiles: ["demo"]
    environment:
      <<: *safe-environment
      MODE: demo
      TRADING_MODE: demo
      DEMO_TRADING: "true"
      BINANCE_TESTNET: "true"
      BINANCE_FUTURES_BASE_URL: https://testnet.binancefuture.com
      PAPER_TRADING: "false"
      RISK_ENGINE_ENABLED: "true"
      KILL_SWITCH_ENABLED: "true"
      KILL_SWITCH_PATH: /app/data/KILL_SWITCH
      STOP_LOSS_REQUIRED: "true"
      MAX_RISK_PER_TRADE: "0.005"
      MAX_DAILY_LOSS: "0.02"
      MAX_LEVERAGE: "3"
    command: ["python", "-m", "silver_bot"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backtest:
    <<: *bot-common
    profiles: ["backtest"]
    environment:
      <<: *safe-environment
      TRADING_MODE: backtest
      PAPER_TRADING: "false"
      ML_FILTER_ENABLED: "${ML_FILTER_ENABLED:-false}"
    command: ["python", "-m", "silver_bot", "--candles", "/app/data/candles"]
    restart: "no"

  research:
    <<: *bot-common
    profiles: ["research"]
    environment:
      <<: *safe-environment
      TRADING_MODE: backtest
      PAPER_TRADING: "false"
      ML_FILTER_ENABLED: "false"
    command: ["python", "-m", "silver_bot", "--candles", "/app/data/candles"]
    restart: "no"

volumes:
  pgdata:
