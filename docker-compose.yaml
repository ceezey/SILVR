name: silvr

x-safe-environment: &safe-environment
  LIVE_TRADING: "false"
  DATABASE_URL: postgresql://silvr:${POSTGRES_PASSWORD:-silvr}@postgres:5432/silvr
  TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-false}"
  ML_FILTER_ENABLED: "${ML_FILTER_ENABLED:-false}"

x-bot-common: &bot-common
  build:
    context: .
  image: silvr:local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./models:/app/models
    - ./reports:/app/reports

services:
  # Postgres for the bot (and the tests locally). On a server, set POSTGRES_PASSWORD in .env.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: silvr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silvr}
      POSTGRES_DB: silvr
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silvr -d silvr"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  # Paper mode has no strategy runtime yet (trend_ensemble is backtest only): this container exits 2 with a
  # usage error before any network call, and the systemd unit does not restart exit 2.
  bot:
    <<: *bot-common
    container_name: silvr-paper
    environment:
      <<: *safe-environment
      TRADING_MODE: paper
      PAPER_TRADING: "true"
    command: ["python", "-m", "silvr"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Read-only status page on the host's 127.0.0.1 only (host network, no published port).
  # Reach it from your PC with an SSH tunnel: ssh -L 8765:127.0.0.1:8765 <server>.
  # The systemd unit starts it detached, so a dashboard failure never stops the bot.
  dashboard:
    <<: *bot-common
    network_mode: host
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    environment:
      <<: *safe-environment
      DATABASE_URL: postgresql://silvr:${POSTGRES_PASSWORD:-silvr}@127.0.0.1:${POSTGRES_PORT:-5432}/silvr
    command: ["python", "-m", "silvr.monitoring.dashboard_server", "--port", "8765"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # Paper and demo profiles also exit 2 until a trend runtime exists.
  paper:
    <<: *bot-common
    profiles: ["paper"]
    environment:
      <<: *safe-environment
      TRADING_MODE: paper
      PAPER_TRADING: "true"
    command: ["python", "-m", "silvr"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  demo:
    <<: *bot-common
    profiles: ["demo"]
    environment:
      <<: *safe-environment
      MODE: demo
      TRADING_MODE: demo
      DEMO_TRADING: "true"
      BINANCE_TESTNET: "true"
      BINANCE_FUTURES_BASE_URL: https://testnet.binancefuture.com
      PAPER_TRADING: "false"
      RISK_ENGINE_ENABLED: "true"
      KILL_SWITCH_ENABLED: "true"
      KILL_SWITCH_PATH: /app/data/KILL_SWITCH
      STOP_LOSS_REQUIRED: "true"
      MAX_RISK_PER_TRADE: "0.005"
      MAX_DAILY_LOSS: "0.02"
      MAX_LEVERAGE: "3"
    command: ["python", "-m", "silvr"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backtest:
    <<: *bot-common
    profiles: ["backtest"]
    environment:
      <<: *safe-environment
      TRADING_MODE: backtest
      PAPER_TRADING: "false"
      ML_FILTER_ENABLED: "${ML_FILTER_ENABLED:-false}"
    command: ["python", "-m", "silvr", "--candles", "/app/data/candles", "--funding", "/app/data/funding"]
    restart: "no"

  research:
    <<: *bot-common
    profiles: ["research"]
    environment:
      <<: *safe-environment
      TRADING_MODE: backtest
      PAPER_TRADING: "false"
      ML_FILTER_ENABLED: "false"
    command: ["python", "-m", "silvr", "--candles", "/app/data/candles", "--funding", "/app/data/funding"]
    restart: "no"

volumes:
  pgdata:
