[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silvr"
version = "0.1.0"
description = "ICT Silver Bullet research, backtesting, and paper trading bot."
requires-python = ">=3.11"
dependencies = ["ccxt>=4.5,<5", "psycopg[binary]>=3.3,<4"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
silvr = "silvr.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"silvr.monitoring" = ["fonts/*.woff2", "fonts/OFL.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
